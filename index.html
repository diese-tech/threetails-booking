<!DOCTYPE html>
<html>
<head>
  <title>Three Tails Cafe Booking</title>
  <style>
    body {
      font-family: Arial;
      background: #fff8f2;
      text-align: center;
      padding: 40px;
    }

    .slot {
      display: inline-block;
      margin: 10px;
      padding: 15px 25px;
      background: #ffe4e1;
      border-radius: 12px;
      cursor: pointer;
    }

    .slot:hover {
      background: #ffd1cc;
    }
  </style>
</head>
<body>

  <h1>🐾 Book Your Cat Lounge Time</h1>

  <h2>Select a Time</h2>

  <div class="slot">1:00 PM – 2:00 PM</div>
  <div class="slot">2:00 PM – 3:00 PM</div>
  <div class="slot">3:00 PM – 4:00 PM</div>

</body>
</html>
