<!DOCTYPE html>
<html>
<head>
  <title>Three Tails Cafe Booking</title>
  <style>
    body {
      font-family: Arial;
      background: #fff8f2;
      text-align: center;
      padding: 40px;
    }

    .slot {
      display: inline-block;
      margin: 10px;
      padding: 15px 25px;
      background: #ffe4e1;
      border-radius: 12px;
      cursor: pointer;
    }

    .slot:hover {
      background: #ffd1cc;
    }

    .selected {
      background: #ffb3a7 !important;
    }

    #selection {
      margin-top: 20px;
      font-size: 18px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 16px;
      background: #ffb3a7;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #ff998a;
    }

    input {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
    }
  </style>
</head>
<body>

  <h1>🐾 Book Your Cat Lounge Time</h1>

  <h2>Select a Date</h2>
  <input type="date" id="datePicker" />

  <h2>Select a Time</h2>

  <div class="slot" onclick="selectSlot(this)">1:00 PM – 2:00 PM</div>
  <div class="slot" onclick="selectSlot(this)">2:00 PM – 3:00 PM</div>
  <div class="slot" onclick="selectSlot(this)">3:00 PM – 4:00 PM</div>

  <div id="selection"></div>

  <h2>Your Info</h2>
  <input type="text" id="name" placeholder="Your Name" />
  <input type="email" id="email" placeholder="Your Email" />

  <br/>
  <button onclick="confirmBooking()">Confirm Booking</button>

  <div id="confirmation"></div>

  <script>
    let selectedTime = "";

    function selectSlot(element) {
      const date = document.getElementById('datePicker').value;

      if (!date) {
        alert("Please select a date first 🐾");
        return;
      }

      document.querySelectorAll('.slot').forEach(slot => {
        slot.classList.remove('selected');
      });

      element.classList.add('selected');
      selectedTime = element.innerText;

      document.getElementById('selection').innerText =
        "Booking: " + date + " at " + selectedTime;
    }

    function confirmBooking() {
      const date = document.getElementById('datePicker').value;
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;

      if (!date || !selectedTime || !name || !email) {
        alert("Please complete all fields 🐾");
        return;
      }

      document.getElementById('confirmation').innerText =
        "✅ Booking confirmed for " + name + " on " + date + " at " + selectedTime;
    }
  </script>

</body>
</html>
